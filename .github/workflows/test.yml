name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # No `forge fmt --check`: sources are kept as published upstream (the SIH files match BscScan byte for byte).

      - name: Run Forge build
        run: forge build --sizes

      # --isolate: see infinity-core#35
      - name: Run Forge tests
        run: forge test --isolate -vvv

      # The Shared Inventory Hook tests run on infinity-core 7c1090e, the revision deployed on BSC (lib/infinity-core-bsc).
      - name: Run Shared Inventory Hook tests (BSC core 7c1090e)
        run: forge test --isolate -vvv
        env:
          FOUNDRY_PROFILE: bsc
